# Nirvana: the current plan. Rewrite this whenever you make a new plan,
# and give it a NEW plan_id (that resets "stopped" coins and cancels old-plan orders).
# All prices are USDT (Binance pairs). Amounts are php: or usdt: per tranche.
#
# Ported from the 2026-11-21 9:57 PM plan. Amounts for BTC-3 and HYPE-1 were not in the
# files I got; I inferred them from the ₱2,600 total. CHECK THEM.
# Several tranches will be BLOCKED by the bot as written. That is deliberate; see README
# "What the bot will say about tonight's plan".

plan_id: 2026-11-21-a
created: 2026-11-21T21:57:00+08:00
valid_until: 2026-12-05T08:00:00+08:00   # after this: no new buys until you write a new plan

manual_inputs:
  etf_outflows: true                      # multi-day BTC spot ETF outflows?
  etf_outflows_updated: 2026-11-21T22:00:00+08:00
  php_per_usdt: 63.94
  php_per_usdt_updated: 2026-11-21T22:00:00+08:00

blackouts:                                # Manila dates, inclusive. No new buys; resting buys get cancelled.
  - {name: HYPE unlock, coins: [HYPE], start: 2026-12-05, end: 2026-12-07}
  - {name: FOMC, coins: all, start: 2026-12-08, end: 2026-12-10}

coins:
  BTC:
    status: active                        # active | watch | off
    narrative: store-of-value
    wrong_if: 52300                       # sell everything on a UTC daily CLOSE below this
    fill_by: 2026-12-05                   # unfilled tranches after this date...
    on_deadline: cancel                   # ...cancel | buy_rest (needs deadline_max_price)
    take_profit_levels: [68000, 74000]    # alerts only
    tranches:
      - {id: BTC-1, type: marketable, max_price: 60338.1, php: 600}
      - {id: BTC-2, type: limit, price: 57000, php: 600}
      - id: BTC-3
        type: conditional                 # becomes a marketable buy when `when` is true
        max_price: 63000                  # my placeholder cap; set your own
        php: 600
        when:
          any:
            - calm_days: {n: 2, floor: 55632, max_tr_atr: 1.0}
            - close_above: 62000

  HYPE:
    status: active
    narrative: perp-dex
    wrong_if: 45                          # Loot export: $45 supersedes the $48 said once on Nov 21
    fill_by: 2026-12-04
    on_deadline: cancel
    tranches:
      - {id: HYPE-1, type: marketable, max_price: 61, php: 300}
      - {id: HYPE-2, type: limit, price: 52, php: 500}

  ETH:  {status: watch, narrative: smart-contract-l1}
  SOL:  {status: watch, narrative: smart-contract-l1, alert_below: 70}
  BNB:  {status: watch, narrative: exchange}
  ZEC:  {status: watch, narrative: privacy, alert_below: 760, max_pct: 10}
  NEAR: {status: watch, narrative: ai-l1, alert_below: 2.60}   # limit idea at 2.60, no amount set
